<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <link rel="icon" type="ی" href="data:image/png;base64,">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RadioMeysam</title>

<style>

    body{
        margin:0;
        background:#111;
        font-family: sans-serif;
        color:white;
    }

    .header{
        padding:20px;
        font-size:22px;
        font-weight:bold;
    }

    /* ⭐ گرید هوشمند – دقیقاً چیزی که خواستی */
    .radio-grid{
        display:grid;
        gap:20px;
        padding:20px;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }

    .station{
        background:#181818;
        border-radius:12px;
        padding:10px;
        cursor:pointer;
        transition:.2s;
        text-align:center;
    }

    .station img{
        width:100%;
        height:150px;
        object-fit:cover;
        border-radius:10px;
    }

    .station:hover{
        background:#222;
        transform:scale(1.05);
    }

    /* ⭐ پلیر زیبا */
    .player{
        position:fixed;
        bottom:0;
        left:0;
        width:100%;
        background:#000;
        padding:15px 25px;
        box-shadow:0 -3px 15px rgba(0,0,0,.7);
        display:flex;
        justify-content:space-between;
        align-items:center;
    }

    .player audio{
        width:100%;
        max-width:400px;
    }

    .title{
        font-size:16px;
        opacity:.8;
        margin-left:20px;
    }

</style>
<link rel="stylesheet" href="style.css">
</head>

