    body{

    .header{

        font-size:22px;
        font-weight:bold;
    }

    /* ⭐ گرید هوشمند – دقیقاً چیزی که خواستی */
    .radio-grid{
        display:grid;
        gap:20px;
        padding:20px;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }

    .station{
        background:#181818;
        border-radius:12px;
        padding:10px;
        cursor:pointer;
        transition:.2s;
        text-align:center;
    }

    .station img{
        width:100%;
        height:150px;
        object-fit:cover;
        border-radius:10px;
    }

    .station:hover{
        background:#222;
        transform:scale(1.05);
    }

    /* ⭐ پلیر زیبا */
    .player{
        position:fixed;
        bottom:0;
        left:0;
        width:100%;
        background:#000;
        padding:15px 25px;
        box-shadow:0 -3px 15px rgba(0,0,0,.7);
        display:flex;
        justify-content:space-between;
        align-items:center;
    }

    .player audio{
        width:100%;
        max-width:400px;
    }

    .title{
        font-size:16px;
        opacity:.8;
        margin-left:20px;
    }

<div class="player">
------<audio id="player" controls></audio>
</div>

<script>
    const stations = document.querySelectorAll(".station");
    const player   = document.getElementById("player");
    const title    = document.getElementById("title");

    stations.forEach(st => {
        st.addEventListener("click", () => {
            const src = st.getAttribute("data-src");
            player.src = src;
            player.play();
            title.innerHTML = st.innerText;
        });
    });
</script>
